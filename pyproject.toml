[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rahkaran-erp-mysql-integration"
version = "0.1.0"
description = "Clean-room synthetic ERP-to-MySQL integration demonstration"
requires-python = ">=3.11"
dependencies = ["PyMySQL>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]
